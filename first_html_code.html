<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First HTML code</title>
</head>
<!--The 20 HTML tags are:
html, head, meta, title, body, h1, br, h2, p, a, img, ul, li, ol, div, span, table, tr, th, td-->
<body>
    <h1>Hello Sir Dexter</h1>
    <br><br>
    <h2>HTML Tags</h2>
    <p>HTML tags are the building blocks of HTML. They are used to create elements on a webpage.</p>

    <a href="https://facebook.com">Follow me on Facebook</a>
    <br><br>
    
    <img src="image.jpg" alt="Image">
    <br><br>
    <ul>
        <li>Jiefhox</li>
    </ul>

    <ol>
        <li>Monter</li>
    </ol>

    <div>Hi, It's me! Jiefhox</div>
    <span>From Section EULM1</span>
    <br><br>
    <table border="1"> My Full Name
        <br><br>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
        </tr>
        <tr>
            <td>Jiefhox</td>
            <td>Monter</td>
        </tr>
    </table>
    
</body>
</html>
